services:
  postgres:
    # Major 17 is fixed; this tag receives subsequent 17.x minor/security updates.
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD locally}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres17_data:
