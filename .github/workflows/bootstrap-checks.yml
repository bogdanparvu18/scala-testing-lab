name: Bootstrap recovery checks
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/main/scala/lab/PostgresStore.scala'
      - '.github/workflows/bootstrap-checks.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Load the native and Docker entry points
        shell: pwsh
        env:
          CHECK_SHELL: ${{ matrix.shell }}
        run: |
          $engine = "$env:CHECK_SHELL.exe"
          & $engine -NoProfile -NonInteractive -File scripts/bootstrap-windows.ps1 -Help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $engine -NoProfile -NonInteractive -File scripts/bootstrap-windows.ps1 --Docker -Help
          exit $LASTEXITCODE
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Linux bootstrap and JavaScript helper syntax
        run: |
          bash -n scripts/bootstrap-unix.sh
          shellcheck -S warning scripts/bootstrap-unix.sh
          for helper in scripts/*.cjs scripts/*.mjs; do node --check "$helper"; done
  postgres-login:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: bootstrap_ci_admin
        ports:
          - 5432/tcp
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Verify creation, reuse, and authentication failures against PostgreSQL
        shell: pwsh
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tokens = $null; $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/bootstrap-windows.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $names = @('Run', 'Invoke-DatabaseSql', 'New-LabDatabaseRole', 'Initialize-LabDatabase', 'Assert-ServerVersion', 'Open-LabDatabase')
          foreach ($definition in $ast.FindAll({ param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] }, $false)) {
            if ($definition.Name -in $names) { Invoke-Expression $definition.Extent.Text }
          }
          function Ensure-LocalPostgres { }
          function Test-BootstrapInteractive { return $true }
          $script:adminPrompts = 0
          function Read-Host {
            $script:adminPrompts++
            return (ConvertTo-SecureString 'bootstrap_ci_admin' -AsPlainText -Force)
          }
          function Check([bool]$condition, [string]$message) { if (-not $condition) { throw $message } }
          $PsqlPath = (Get-Command psql).Source
          $PgHost = '127.0.0.1'; $Port = [int]$env:PGPORT; $PgAdminUser = 'postgres'
          $DbUser = 'scala_lab'; $Database = 'bootstrap_login_ci'; $ProvisionDatabase = $false
          $env:PGPASSWORD = 'aurora'; $env:PGCONNECT_TIMEOUT = '10'
          Open-LabDatabase
          Check ($script:adminPrompts -eq 1) 'First run must check the catalog through the administrator.'
          Check ((Invoke-DatabaseSql 'SELECT current_user;') -ceq 'scala_lab') 'New login was not usable.'
          $roleOid = Invoke-DatabaseSql "SELECT oid FROM pg_roles WHERE rolname='scala_lab';"
          Open-LabDatabase
          Check ($script:adminPrompts -eq 1) 'Second run must reuse the login without administrator prompts.'
          Check ((Invoke-DatabaseSql "SELECT oid FROM pg_roles WHERE rolname='scala_lab';") -eq $roleOid) 'Role was replaced.'
          $env:PGPASSWORD = 'wrong_ci_password'
          $failure = $null
          try { Open-LabDatabase } catch { $failure = $_.Exception.Message }
          Check ($failure -like '*role ''scala_lab'' exists*') 'Wrong password must produce an explicit error.'
          $env:PGPASSWORD = 'aurora'
          Open-LabDatabase
          Check ((Invoke-DatabaseSql 'SELECT 1;') -eq '1') 'Existing password was changed.'
          $Database = 'bootstrap_login_second_ci'
          Open-LabDatabase
          Check ((Invoke-DatabaseSql 'SELECT current_database();') -eq $Database) 'Missing database was not created for the existing role.'
          $DbUser = 'bootstrap_added_ci'; $ProvisionDatabase = $true
          Open-LabDatabase
          Check ((Invoke-DatabaseSql 'SELECT current_user;') -eq $DbUser) 'Missing role was not created when the database existed.'
          $env:PGPASSWORD = 'bootstrap_ci_admin'
          $owner = Invoke-DatabaseSql "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='$Database';" postgres postgres
          Check ($owner -eq 'scala_lab') 'Existing database ownership was changed.'
          Write-Host 'PostgreSQL creation, repeat run, wrong password, and missing-object checks passed.'
      - name: Verify Docker worker login recovery against PostgreSQL
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          python3 - <<'PY'
          import os, pathlib, pty, select, shutil, subprocess, time
          source = pathlib.Path('scripts/bootstrap-unix.sh').read_text()
          begin = source.index('sql() {')
          functions = source[begin:source.index('\nstart=$SECONDS', begin)]
          client = shutil.which('psql')
          admin_env = {**os.environ, 'PGHOST':'127.0.0.1', 'PGUSER':'postgres', 'PGDATABASE':'postgres', 'PGPASSWORD':'bootstrap_ci_admin'}
          def admin(sql):
              return subprocess.check_output([client, '-X', '-w', '-v', 'ON_ERROR_STOP=1', '-Atc', sql], env=admin_env, text=True).strip()
          for db in ('bootstrap_login_ci', 'bootstrap_login_second_ci', 'bootstrap_docker_ci', 'bootstrap_docker_second_ci'):
              admin('DROP DATABASE IF EXISTS "' + db + '";')
          for role in ('bootstrap_added_ci', 'bootstrap_docker_added_ci', 'scala_lab'):
              admin('DROP ROLE IF EXISTS "' + role + '";')
          def run(password='aurora', database='bootstrap_docker_ci', user='scala_lab', provision='0', admin_password='bootstrap_ci_admin', noninteractive='0'):
              env = {**admin_env, 'PGUSER':user, 'PGDATABASE':database, 'PGPASSWORD':password, 'PSQL':client,
                     'PG_ADMIN_USER':'postgres', 'PROVISION_DATABASE':provision, 'NON_INTERACTIVE':noninteractive}
              master, slave = pty.openpty()
              process = subprocess.Popen(['bash', '-c', 'set -euo pipefail\n' + functions + '\nopen_lab_database'], env=env, stdin=slave, stdout=slave, stderr=slave)
              os.close(slave)
              output, prompts, deadline = b'', 0, time.monotonic() + 45
              try:
                  while time.monotonic() < deadline:
                      if select.select([master], [], [], .1)[0]:
                          try: chunk = os.read(master, 65536)
                          except OSError: break
                          if not chunk: break
                          output += chunk
                          if output.count(b'Administrator password for ') > prompts:
                              prompts += 1
                              os.write(master, (admin_password + '\n').encode())
                      elif process.poll() is not None: break
                  if process.poll() is None: process.wait(timeout=5)
              finally:
                  if process.poll() is None: process.kill(); process.wait()
                  os.close(master)
              return process.returncode, output.decode(errors='replace'), prompts
          result = run()
          assert result[0] == 0 and result[2] == 1, result
          original = admin("SELECT oid::text || ':' || rolpassword FROM pg_authid WHERE rolname='scala_lab';")
          assert admin("SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname='scala_lab';") == 'f'
          result = run()
          assert result[0] == 0 and result[2] == 0, result
          result = run(password='wrong_ci_password')
          assert result[0] != 0 and "role 'scala_lab' exists" in result[1], result
          assert admin("SELECT oid::text || ':' || rolpassword FROM pg_authid WHERE rolname='scala_lab';") == original
          result = run(database='bootstrap_docker_second_ci')
          assert result[0] == 0, result
          result = run(database='bootstrap_docker_second_ci', user='bootstrap_docker_added_ci', provision='1')
          assert result[0] == 0, result
          assert admin("SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='bootstrap_docker_second_ci';") == 'scala_lab'
          result = run(password='wrong_ci_password', admin_password='wrong_admin_password')
          assert result[0] != 0 and 'administrator authentication/connection failed' in result[1], result
          result = run(password='wrong_ci_password', noninteractive='1')
          assert result[0] != 0 and result[2] == 0 and 'Run interactively' in result[1], result
          print('Docker worker creation, repeat authentication, missing objects, and failure checks passed.')
          PY
  grouped-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scala_lab_ci
          POSTGRES_USER: scala_lab
          POSTGRES_PASSWORD: fixture_password
        ports:
          - 5432/tcp
        options: --health-cmd="pg_isready -U scala_lab -d scala_lab_ci" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Run both database fixtures in one sbt process
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGDATABASE: scala_lab_ci
          PGUSER: scala_lab
          PGPASSWORD: fixture_password
        run: |
          launcher="$RUNNER_TEMP/sbt-launch-1.10.2.jar"
          curl --fail --location --retry 2 --silent --show-error \
            https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/1.10.2/sbt-launch-1.10.2.jar -o "$launcher"
          printf '%s  %s\n' cdd6963b622f42690cb2e3154bde3f3257a03839f216e1b5d7420000d6a71817 "$launcher" | sha256sum -c -
          java -Dsbt.supershell=false -jar "$launcher" clean test \
            'Test / runMain lab.ProductIntegrationCheck' \
            'Test / runMain lab.ProductSearchIntegrationCheck'
